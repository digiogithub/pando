<body>
<header class="sheet-head">
  <h1>{{TITLE}}</h1>
  <p class="lede">What these options are for. Replace it.</p>
</header>

<!-- Newest round first. Insert new rounds above this one; never edit an older
     round, because the user is comparing against what they already saw. -->
<section class="round" id="round-1">
  <h2 class="round-head">Round 1 — the decision this round settles</h2>

  <div class="row">
    <article class="option" id="1a">
      <div class="option-head"><span class="badge">1a</span> Name of this direction</div>
      <div class="canvas">
        <!-- Build the option here, at full fidelity. -->
      </div>
      <p class="tradeoff">What it does well, and what it costs. One line.</p>
    </article>

    <article class="option" id="1b">
      <div class="option-head"><span class="badge">1b</span> Name of this direction</div>
      <div class="canvas">
        <!-- Same content, one dimension changed. -->
      </div>
      <p class="tradeoff">What it does well, and what it costs. One line.</p>
    </article>
  </div>
</section>
