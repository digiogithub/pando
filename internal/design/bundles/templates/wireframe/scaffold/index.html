<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="sheet-head">
  <h1>{{TITLE}}</h1>
  <p class="question">The question these wireframes are meant to settle. Replace it.</p>
</header>

<main class="options">
  <figure class="screen" id="a">
    <figcaption><span class="tag">A</span> Name of this option</figcaption>
    <div class="frame">
      <div class="bar">header</div>
      <div class="body">
        <div class="block h1">Screen title</div>
        <div class="block text">three lines about what this screen holds</div>
        <div class="ph">[ product shot ]</div>
        <div class="block action">Primary action</div>
      </div>
    </div>
    <p class="tradeoff">What this option trades away. One line.</p>
  </figure>

  <figure class="screen" id="b">
    <figcaption><span class="tag">B</span> Name of this option</figcaption>
    <div class="frame">
      <div class="bar">header</div>
      <div class="body two-col">
        <div class="side">nav</div>
        <div>
          <div class="block h1">Screen title</div>
          <div class="block text">three lines about what this screen holds</div>
          <div class="block action">Primary action</div>
        </div>
      </div>
    </div>
    <p class="tradeoff">What this option trades away. One line.</p>
  </figure>
</main>
</body>
</html>
