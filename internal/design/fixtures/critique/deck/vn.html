<!doctype html>
<html lang="en">
<head>
<title>Quarter review</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #ffffff; color: #111111; }
  .slide { width: 1280px; height: 720px; padding: 64px; box-sizing: border-box; }
  @page { size: 1280px 720px; margin: 0; }
  @media print {
    .slide { break-after: page; page-break-after: always; }
    .slide:last-of-type { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
  <section class="slide"><h1>Quarter review</h1></section>
  <section class="slide"><h2>What shipped</h2></section>
  <section class="slide"><h2>What is next</h2></section>
</body>
</html>
