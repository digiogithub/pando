<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pando · design canvas</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101014;
    --grid: #1b1b21;
    --panel: #17171d;
    --panel-2: #1f1f27;
    --line: #2b2b35;
    --text: #e8e8ee;
    --muted: #9a9aa8;
    --accent: #7c8cff;
    --ok: #4ec98a;
    --warn: #e0a83a;
    --err: #e06060;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  /* --- toolbar ------------------------------------------------------- */
  #bar {
    position: fixed; inset: 0 0 auto 0; z-index: 30;
    display: flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 12px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  #bar .brand { font-weight: 600; letter-spacing: .01em; }
  #bar .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .spacer { flex: 1; }
  .group { display: flex; align-items: center; gap: 4px; }
  button, select {
    appearance: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 9px;
    font: inherit;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #3a3a48; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  select { max-width: 220px; }
  #zoom { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
  #live { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #dot.stale { background: var(--warn); }
  #dot.down { background: var(--err); }

  /* --- canvas -------------------------------------------------------- */
  #viewport {
    position: fixed; inset: 44px 0 0 0;
    overflow: hidden;
    cursor: grab;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px;
  }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

  /* --- artboards ----------------------------------------------------- */
  .board { position: absolute; }
  .board .label {
    display: flex; align-items: baseline; gap: 8px;
    height: 26px; padding: 0 2px;
    font-size: 13px; white-space: nowrap;
  }
  .board .name { font-weight: 600; }
  .board .meta { color: var(--muted); font-size: 12px; }
  .board .badge {
    font-size: 11px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .board .badge.building { color: var(--warn); border-color: var(--warn); }
  .board .badge.error { color: var(--err); border-color: var(--err); }
  .board .open {
    margin-left: auto; font-size: 11px; padding: 1px 7px;
    opacity: 0; transition: opacity .12s;
  }
  .board:hover .open { opacity: 1; }
  .board .frame {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .board.flash .frame { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
  .board .frame iframe { display: block; border: 0; background: #fff; }
  /* The capture layer is what makes the canvas read-only: every pointer event
     over an artboard belongs to the canvas, never to the document inside it. */
  .board .capture { position: absolute; inset: 0; background: transparent; }
  .board .fail {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: var(--panel); color: var(--err); font-size: 14px; padding: 24px; text-align: center;
  }

  /* --- side panels --------------------------------------------------- */
  #activity {
    position: fixed; left: 12px; bottom: 12px; z-index: 20;
    width: 320px; max-height: 40vh; overflow: auto;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px;
  }
  #activity h2 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #activity ol { list-style: none; margin: 0; padding: 0; }
  #activity li { display: flex; gap: 8px; padding: 2px 0; font-size: 12px; }
  #activity time { color: var(--muted); font-variant-numeric: tabular-nums; }
  #hint {
    position: fixed; right: 12px; bottom: 12px; z-index: 20;
    color: var(--muted); font-size: 12px; text-align: right;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  #hint kbd {
    font: inherit; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px;
  }
  #empty {
    position: fixed; inset: 44px 0 0 0; z-index: 10;
    display: grid; place-content: center; place-items: center; gap: 8px;
    color: var(--muted); text-align: center; pointer-events: none;
  }
  #empty strong { color: var(--text); font-size: 15px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header id="bar">
    <span class="brand">Pando <small>design canvas · read-only</small></span>
    <span class="group">
      <select id="jump" title="Jump to an artboard"><option value="">Artboards…</option></select>
    </span>
    <span class="spacer"></span>
    <span class="group">
      <button id="zoom-out" title="Zoom out (-)">−</button>
      <span id="zoom">100%</span>
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <button id="fit" title="Fit everything (F)">Fit</button>
      <button id="actual" title="Actual size (0)">1:1</button>
    </span>
    <span class="group">
      <button id="follow" aria-pressed="true" title="Pan to whatever the agent is working on">Follow</button>
    </span>
    <span id="live"><span id="dot"></span><span id="live-text">live</span></span>
  </header>

  <div id="viewport"><div id="world"></div></div>

  <div id="empty">
    <strong>No design artifacts yet</strong>
    <span>Artboards appear here as the agent creates and renders them.</span>
  </div>

  <aside id="activity">
    <h2>Build activity</h2>
    <ol id="activity-list"></ol>
  </aside>

  <aside id="hint">
    drag to pan · wheel to zoom · <kbd>F</kbd> fit · <kbd>0</kbd> 1:1 · double-click an artboard to focus
  </aside>

  <script src="canvas.js" defer></script>
</body>
</html>
