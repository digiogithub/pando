name: Bug report
description: Report something that is broken or behaving unexpectedly in Pando.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much of this as you can —
        it helps a maintainer reproduce the problem quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you expect to happen instead?
      placeholder: Tell us what you saw, and what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact commands or actions that trigger the bug.
      placeholder: |
        1. Run `pando ...`
        2. ...
        3. See error
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        Paste any relevant output from the TUI/Web UI, or from `pando -d` (debug logging). This
        is pasted as-is — please redact anything sensitive (API keys, file paths, etc.) yourself
        before pasting, or use the Debug ID field below instead of pasting logs.
      render: shell
    validations:
      required: false

  - type: input
    id: debug-id
    attributes:
      label: Debug ID (optional)
      description: >
        If you have Remote Telemetry enabled (Settings → General → Remote Telemetry in the
        TUI/Web UI, or `pando telemetry id` on the command line), paste your debug ID here so a
        maintainer can look up your shipped diagnostics without you having to paste logs. This is
        a random anonymous ID, not tied to your identity — leave it blank if you don't have
        telemetry enabled.
      placeholder: "1234-5678-9012-3456"
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Pando version
      description: Output of `pando --version`.
      placeholder: "v0.311.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install Pando?
      options:
        - Pre-built release binary
        - go install
        - Built from source (make build)
        - Desktop app (Wails)
        - Other / not sure
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Configuration, MCP servers, LSP servers, or anything else that might be relevant.
    validations:
      required: false
